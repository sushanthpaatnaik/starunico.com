  reference it, so nothing else needs to change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 96" role="img" aria-label="Starunico Capital">
  <title>Starunico Capital</title>
  <!-- sprout -->
  <g fill="none" stroke="#5B6E8F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 60 C 30 43, 35 26, 51 15" />
