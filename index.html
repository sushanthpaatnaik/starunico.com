<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Starunico Capital is a proprietary deep-tech investment firm backed by family capital. We invest our own capital into a highly selective portfolio of early-stage deep-tech companies."
    />
    <title>Starunico Capital — Proprietary Deep-Tech Investment</title>
    <link rel="canonical" href="https://starunicocapital.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starunico Capital" />
    <meta property="og:url" content="https://starunicocapital.com/" />
    <meta property="og:title" content="Starunico Capital — Proprietary Deep-Tech Investment" />
    <meta
      property="og:description"
      content="We invest our own capital into a highly selective portfolio of early-stage deep-tech companies and partner with them for long-term value creation."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the stored/system theme before first paint so the page never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('starunico-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-white text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
